name: Release

# Push a tag that matches the version in manifest.json (for example `1.0.1`,
# no "v" prefix) and this workflow publishes a GitHub release with the three
# files Obsidian and BRAT need: main.js, manifest.json and styles.css.
# Tags containing a hyphen (for example `1.1.0-beta.1`) are published as
# pre-releases, which BRAT can install as beta versions.
#
# You can also create a release from the GitHub website (Releases → Draft a new
# release → new tag such as 1.0.1 → Publish). The workflow then attaches the
# three files to that release.

on:
  push:
    tags:
      - "*"
  release:
    types: [published]

permissions:
  contents: write

# A tag created from the website can fire both events; run them one at a time.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the tag matches manifest.json and versions.json
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          MANIFEST_VERSION=$(jq -r .version manifest.json)
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match manifest.json version '$MANIFEST_VERSION'."
            exit 1
          fi
          if ! jq -e --arg v "$TAG" 'has($v)' versions.json > /dev/null; then
            echo "::error::versions.json has no entry for '$TAG'."
            exit 1
          fi

      - name: Check main.js
        run: node --check main.js

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Release already exists (e.g. created from the GitHub UI): refresh its files.
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
          else
            FLAGS=""
            case "$TAG" in *-*) FLAGS="--prerelease" ;; esac
            gh release create "$TAG" main.js manifest.json styles.css \
              --title "Life Log $TAG" \
              --generate-notes \
              $FLAGS
          fi
