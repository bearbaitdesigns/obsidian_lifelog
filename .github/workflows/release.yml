name: Release

# Publishes a GitHub release with the three files Obsidian and BRAT need:
# main.js, manifest.json and styles.css. Three ways to start it:
#
#   1. Actions tab → Release → Run workflow. Releases the version that is in
#      manifest.json (the tag is created for you).
#   2. Push a tag that matches the version in manifest.json, e.g. `1.0.1`
#      (no "v" prefix).
#   3. Publish a release from the GitHub website with a matching tag; the
#      files are attached to it.
#
# Versions with a hyphen (e.g. `1.1.0-beta.1`) are published as pre-releases,
# which BRAT can install as beta versions.

on:
  workflow_dispatch:
  push:
    tags:
      - "*"
  release:
    types: [published]

permissions:
  contents: write

# A tag created from the website can fire more than one event; run them one at a time.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Work out the version
        run: |
          MANIFEST_VERSION=$(jq -r .version manifest.json)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$MANIFEST_VERSION"
          else
            TAG="${{ github.event.release.tag_name || github.ref_name }}"
          fi
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match manifest.json version '$MANIFEST_VERSION'."
            exit 1
          fi
          if ! jq -e --arg v "$TAG" 'has($v)' versions.json > /dev/null; then
            echo "::error::versions.json has no entry for '$TAG'."
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Check main.js
        run: |
          node --check main.js
          node scripts/check-overrides.js main.js

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Release already exists: refresh its files.
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
          else
            FLAGS=""
            case "$TAG" in *-*) FLAGS="--prerelease" ;; esac
            gh release create "$TAG" main.js manifest.json styles.css \
              --target "$GITHUB_SHA" \
              --title "Life Log $TAG" \
              --generate-notes \
              $FLAGS
          fi
